name: Sync Resources from AstaPS-Resource

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository"
        required: true
        default: "MeChen618/AstaPS-Resource"
      source_branch:
        description: "Source branch"
        required: true
        default: "main"
      sync_mode:
        description: "Sync mode (mirror=完全同步包括删除 / update=仅添加更新)"
        required: true
        default: "mirror"
        type: choice
        options:
          - mirror
          - update

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo root before sync
        run: |
          echo "当前仓库根目录:"
          pwd
          ls -la
          echo "--------------------------------"
          for d in ScriptSceneData Scripts Server; do
            if [ -d "$d" ]; then
              echo "$d 存在，文件数: $(find "$d" -type f | wc -l)"
            else
              echo "$d 不存在"
            fi
          done

      - name: Clone source repo
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo }}
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" /tmp/source_repo
          echo "源仓库根目录:"
          ls -la /tmp/source_repo
          echo "--------------------------------"
          for d in ScriptSceneData Scripts Server; do
            if [ -d "/tmp/source_repo/$d" ]; then
              echo "$d 在源仓库中存在，文件数: $(find "/tmp/source_repo/$d" -type f | wc -l)"
              find "/tmp/source_repo/$d" -maxdepth 2 -type f | head
            else
              echo "$d 不在源仓库中"
            fi
          done

      - name: Sync folders
        run: |
          set -e
          for folder in ScriptSceneData Scripts Server; do
            echo "处理: $folder"
            if [ -d "/tmp/source_repo/$folder" ]; then
              if [ -d "$folder" ]; then
                rm -rf "$folder"
              fi
              cp -R "/tmp/source_repo/$folder" .
              echo "同步后 $folder 目录文件数: $(find "$folder" -type f | wc -l)"
            else
              echo "$folder 在源仓库中不存在"
            fi
          done

      - name: Check git status
        run: |
          echo "git status:"
          git status --short
          echo "--------------------------------"
          git diff --stat || true

      - name: Commit and push if changed
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "没有检测到 Git 差异"
            exit 0
          fi

          git add -A
          git commit -m "chore: sync from $SOURCE_REPO"
          git push origin HEAD
